// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
    dependencyLocking {
        lockAllConfigurations()
    }
    configurations.configureEach {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'io.netty') {
                details.useVersion '4.1.136.Final'
                details.because 'Akido flagged older Netty HTTP/2 and handler transitive dependencies'
            }
            if (details.requested.group == 'com.google.protobuf' && details.requested.name in ['protobuf-java', 'protobuf-kotlin', 'protobuf-java-util']) {
                details.useVersion '4.35.1'
                details.because 'Akido flagged older protobuf transitive dependencies'
            }
            if (details.requested.group == 'org.jetbrains.kotlin' && details.requested.name in ['kotlin-stdlib', 'kotlin-stdlib-common', 'kotlin-stdlib-jdk7', 'kotlin-stdlib-jdk8']) {
                details.useVersion '2.2.20'
                details.because 'Akido flagged older Kotlin stdlib transitive dependencies'
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
